name: weather_station_dashboard
description: Real-time weather station dashboard with historical graphs and dark/light themes.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP client
  dio: ^5.4.0

  # UI
  fl_chart: ^0.65.0
  intl: ^0.19.0

  # Value equality for entities / DTOs
  equatable: ^2.0.5

  # Environment variables
  flutter_dotenv: ^5.1.0
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
